<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" data-i18n="meta_desc" content="钓拉么 - 基于实时气象、风况的智能钓鱼预测工具">
    <meta name="theme-color" content="#060b18">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎣</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <title data-i18n="title">钓拉么 - 智能钓鱼预测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #060b18;
            --bg-surface: #0d1428;
            --bg-card: rgba(16, 26, 50, 0.75);
            --bg-card-solid: rgba(14, 22, 45, 0.88);
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.08);
            --cyan-border: rgba(0, 229, 255, 0.15);
            --purple: #8b5cf6;
            --purple-dim: rgba(139, 92, 246, 0.08);
            --pink: #f472b6;
            --pink-dim: rgba(244, 114, 182, 0.08);
            --emerald: #34d399;
            --emerald-dim: rgba(52, 211, 153, 0.08);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.08);
            --text-primary: #e8edf5;
            --text-secondary: #8892b0;
            --text-muted: #4a5470;
            --border-light: rgba(255,255,255,0.04);
            --border-glow: rgba(0, 229, 255, 0.1);
        }

        body {
            font-family: 'Inter', 'Noto Serif SC', serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
        }
        .bg-glow {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0,229,255,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139,92,246,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(244,114,182,0.03) 0%, transparent 60%);
        }
        .scan-overlay {
            position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.02;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.1) 2px,rgba(0,229,255,0.1) 3px);
        }

        .card {
            background: var(--bg-card); backdrop-filter: blur(24px); border: 1px solid var(--border-light);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3); border-radius: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover { border-color: var(--border-glow); }
        .card-solid {
            background: var(--bg-card-solid); backdrop-filter: blur(24px); border: 1px solid var(--border-light);
            box-shadow: 0 8px 40px rgba(0,0,0,0.35); border-radius: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card-solid:hover { border-color: var(--border-glow); }

        .seal {
            display: inline-flex; align-items: center; justify-content: center;
            width: 38px; height: 38px;
            border: 2px solid var(--pink); border-radius: 5px;
            color: var(--pink); font-family: 'Noto Serif SC', serif;
            font-weight: 700; font-size: 15px; transform: rotate(-2deg);
            background: var(--pink-dim); box-shadow: 0 0 30px rgba(244,114,182,0.1);
            flex-shrink: 0;
        }

        .accent-line { height: 2px; background: linear-gradient(to right, var(--cyan), transparent); border-radius: 1px; width: 60px; }
        .accent-line-purple { height: 2px; background: linear-gradient(to right, var(--purple), transparent); border-radius: 1px; width: 40px; }

        /* 输入/选择通用 */
        .field, .input-field {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 11px 16px; font-size: 14px;
            color: var(--text-primary); width: 100%;
            transition: all 0.25s; font-family: 'Inter', sans-serif;
        }
        .field:focus, .input-field:focus {
            outline: none; border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.1), 0 0 20px rgba(0,229,255,0.05);
            background: rgba(255,255,255,0.05);
        }
        .field::placeholder, .input-field::placeholder { color: var(--text-muted); }
        select.field, select.input-field { appearance: none; cursor: pointer; }
        .input-field option { background: #0d1428; color: var(--text-primary); }

        /* 评分圆环 */
        .score-ring { width: 132px; height: 132px; position: relative; }
        .score-ring svg { transform: rotate(-90deg); width: 132px; height: 132px; }
        .score-ring-bg { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 5; }
        .score-ring-fill {
            fill: none; stroke: url(#scoreGrad); stroke-width: 5;
            stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377;
        }
        .score-ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .track { height: 4px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; }
        .fill { height: 100%; border-radius: 2px; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }

        .badge {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 14px 8px; border-radius: 14px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.25s;
        }
        .badge:hover { background: rgba(255,255,255,0.04); border-color: var(--border-glow); }
        .badge-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* 地图容器 - Leaflet用 */
        #map {
            width: 100%; height: 280px;
            border-radius: 12px; overflow: hidden;
            background: #0a1628; z-index: 1;
        }
        .leaflet-container { background: #0a1628 !important; }
        .leaflet-control-attribution {
            background: rgba(6,11,24,0.7) !important;
            color: var(--text-muted) !important;
            font-size: 10px; padding: 2px 6px !important;
            border: 1px solid rgba(255,255,255,0.04) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-control-attribution a { color: var(--text-secondary) !important; }
        .leaflet-control-zoom a {
            background: rgba(6,11,24,0.7) !important;
            color: var(--text-secondary) !important;
            border: 1px solid rgba(255,255,255,0.06) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-control-zoom a:hover { color: var(--cyan) !important; }

        .tip-card {
            padding: 14px 16px; border-radius: 12px;
            background: rgba(255,255,255,0.02); border-left: 3px solid transparent;
            transition: all 0.25s;
        }
        .tip-card:hover { background: rgba(255,255,255,0.04); }

        @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .anim-rise { animation: rise 0.7s ease-out forwards; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

        .pill {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 500;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
            color: var(--text-secondary);
        }
        .divider {
            display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 11px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.04), transparent);
        }

        .spinner { border: 3px solid rgba(255,255,255,0.03); border-left-color: var(--cyan); border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .custom-div-icon { background: none !important; border: none !important; }

        @media (min-width: 640px) { #map { height: 360px; } }
        @media (min-width: 1024px) { #map { height: 400px; } }
        @media (max-width: 1023px) { .score-ring { width: 108px; height: 108px; } .score-ring svg { width: 108px; height: 108px; } }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
    <defs>
        <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5ff" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#f472b6" />
        </linearGradient>
    </defs>
</svg>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scan-overlay"></div>

<div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-8">

    <!-- ====== 顶栏 ====== -->
    <header class="card px-5 sm:px-7 py-3.5 mb-5 sm:mb-7 flex items-center justify-between anim-rise">
        <div class="flex items-center gap-4">
            <div class="seal">钓</div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wide" style="font-family:'Noto Serif SC',serif;background:linear-gradient(to right,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;" data-i18n="app_name">钓拉么</h1>
                <p class="text-[11px] text-[var(--text-muted)] tracking-wider hidden sm:block" data-i18n="header_sub">—— 数据驱动 · 知鱼知水</p>
            </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="flex rounded-lg p-0.5" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);">
                <button class="lang-btn px-3 py-1 text-[12px] rounded-md font-medium" style="background:var(--cyan-dim);color:var(--cyan);" data-lang="zh">中</button>
                <button class="lang-btn px-3 py-1 text-[12px] rounded-md" style="color:var(--text-muted);" data-lang="en">EN</button>
                <button class="lang-btn px-3 py-1 text-[12px] rounded-md" style="color:var(--text-muted);" data-lang="ja">日</button>
                <button class="lang-btn px-3 py-1 text-[12px] rounded-md" style="color:var(--text-muted);" data-lang="ko">한</button>
            </div>
        </div>
    </header>

    <!-- ====== 主体 ====== -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6">

        <!-- ====== 左列 ====== -->
        <div class="lg:col-span-7 space-y-5 sm:space-y-6">

            <!-- 地图卡片 -->
            <div class="card overflow-hidden anim-rise" style="animation-delay:0.1s">
                <div class="relative">
                    <!-- 搜索栏覆盖在地图上 -->
                    <div class="absolute top-4 left-4 right-4 z-[1000]">
                        <div class="flex gap-2">
                            <div class="flex-1 relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2" style="color:var(--text-muted);font-size:12px;"></i>
                                <input id="location" type="text" data-i18n-placeholder="location_placeholder" placeholder="搜索钓点…" class="w-full rounded-xl py-2.5 pl-9 pr-3 text-sm transition-all shadow-sm" style="background:rgba(6,11,24,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);color:var(--text-primary);" onfocus="this.style.borderColor='var(--cyan)';this.style.boxShadow='0 0 0 3px rgba(0,229,255,0.08)'" onblur="this.style.borderColor='rgba(255,255,255,0.06)';this.style.boxShadow='none'">
                            </div>
                            <button id="search-location-btn" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-sm flex-shrink-0" style="background:rgba(6,11,24,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);color:var(--text-muted);">
                                <i class="fa-solid fa-search text-sm"></i>
                            </button>
                            <button id="get-location" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-sm flex-shrink-0" style="background:rgba(6,11,24,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);color:var(--text-muted);">
                                <i class="fa-solid fa-crosshairs text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div id="map"></div>
                    <div class="text-[10px] text-center py-2" style="color:var(--text-muted);" data-i18n="map_hint"><i class="fa-solid fa-satellite-dish"></i> 点击地图切换钓点</div>
                </div>
            </div>

            <!-- 设置 + 环境混合卡片 -->
            <div class="card p-5 sm:p-6 anim-rise" style="animation-delay:0.18s">
                <!-- 第一行：水域/时间/鱼种 -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5">
                    <div>
                        <label class="block text-[11px] mb-1.5" style="color:var(--text-secondary);" data-i18n="water_type_label">水域类型</label>
                        <select id="fishing-type" class="field">
                            <option value="freshwater" data-i18n="freshwater">淡水钓</option>
                            <option value="saltwater" data-i18n="saltwater">海钓</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] mb-1.5" style="color:var(--text-secondary);" data-i18n="time_label">出钓时间</label>
                        <input id="time" type="datetime-local" class="field">
                    </div>
                    <div>
                        <label class="block text-[11px] mb-1.5" style="color:var(--text-secondary);" data-i18n="target_species">目标鱼种</label>
                        <select id="fish-species" class="field">
                            <option value="auto" data-i18n="species_auto">智能适配</option>
                            <option value="crucian">鲫鱼</option>
                            <option value="carp">鲤鱼</option>
                            <option value="grasscarp">草鱼</option>
                            <option value="silvercarp">鲢鳙</option>
                            <option value="culter">翘嘴</option>
                            <option value="perch">鲈鱼</option>
                            <option value="mandarin">鳜鱼</option>
                            <option value="snakehead">黑鱼</option>
                            <option value="tilapia">罗非鱼</option>
                            <option value="catfish">黄辣丁</option>
                        </select>
                    </div>
                </div>

                <!-- 实时环境五宫格 -->
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-1 h-5 rounded-full" style="background:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,0.3);"></div>
                    <span class="text-sm font-medium" style="font-family:'Noto Serif SC',serif;" data-i18n="env_params">实时环境</span>
                    <span class="ml-auto text-[11px] rounded-full px-2.5 py-0.5" style="color:var(--text-muted);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.03);" data-i18n="auto_fetch">自动感知</span>
                </div>
                <div class="grid grid-cols-5 gap-2 sm:gap-3">
                    <div class="badge">
                        <div class="badge-icon" style="background:var(--cyan-dim);color:var(--cyan);">
                            <i class="fa-solid fa-cloud-sun"></i>
                        </div>
                        <span id="weather-text" class="text-xs font-medium" style="color:var(--text-primary);">--</span>
                        <span class="text-[10px] -mt-1" style="color:var(--text-muted);" data-i18n="factor_weather">天气</span>
                    </div>
                    <div class="badge">
                        <div class="badge-icon" style="background:var(--purple-dim);color:var(--purple);">
                            <i class="fa-solid fa-wind"></i>
                        </div>
                        <span id="wind-level" class="text-xs font-medium" style="color:var(--text-primary);">--</span>
                        <span class="text-[10px] -mt-1" style="color:var(--text-muted);">风速</span>
                    </div>
                    <div class="badge">
                        <div class="badge-icon" style="background:var(--emerald-dim);color:var(--emerald);">
                            <i class="fa-solid fa-droplet"></i>
                        </div>
                        <span id="water-temp-value" class="text-xs font-medium" style="color:var(--text-primary);">--</span>
                        <span class="text-[10px] -mt-1" style="color:var(--text-muted);">水温</span>
                    </div>
                    <div class="badge">
                        <div class="badge-icon" style="background:var(--amber-dim);color:var(--amber);">
                            <i class="fa-solid fa-gauge-high"></i>
                        </div>
                        <span id="pressure-value" class="text-xs font-medium" style="color:var(--text-primary);">--</span>
                        <span class="text-[10px] -mt-1" style="color:var(--text-muted);">气压</span>
                    </div>
                    <div class="badge">
                        <div class="badge-icon" style="background:var(--cyan-dim);color:var(--cyan);">
                            <i class="fa-solid fa-location-arrow"></i>
                        </div>
                        <span id="wind-direction" class="text-xs font-medium" style="color:var(--text-primary);">--</span>
                        <span class="text-[10px] -mt-1" style="color:var(--text-muted);">风向</span>
                    </div>
                </div>
                <p class="text-[11px] text-center mt-3" style="color:var(--text-muted);" data-i18n="data_based_on">数据基于 <span id="location-display" style="color:var(--cyan);">--</span> 的实时气象</p>
            </div>

            <!-- 三栏：温差/月相/气压趋势 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-5 anim-rise" style="animation-delay:0.26s">
                <div id="temp-diff-container" class="card p-4 sm:col-span-1 hidden">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:var(--amber-dim);border:1px solid rgba(251,191,36,0.12);">
                            <i class="fa-solid fa-temperature-high" style="color:var(--amber);font-size:12px;"></i>
                        </div>
                        <span class="text-[11px] tracking-wider" style="color:var(--text-secondary);" data-i18n="weekly_temp_analysis">温差分析</span>
                    </div>
                    <div id="temp-diff-content" class="text-[12px]" style="color:var(--text-secondary);"></div>
                </div>
                <!-- 月相（占位 - JS动态填充） -->
                <div class="card p-4 sm:col-span-1">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:var(--purple-dim);border:1px solid rgba(139,92,246,0.12);">
                            <i class="fa-regular fa-moon" style="color:var(--purple);font-size:12px;"></i>
                        </div>
                        <span class="text-[11px] tracking-wider" style="color:var(--text-secondary);">月相</span>
                    </div>
                    <div class="text-2xl mb-1" id="moon-icon">🌓</div>
                    <span class="text-xs font-medium" style="color:var(--purple);" id="moon-name">--</span>
                    <div class="track mt-2"><div class="fill w-0" id="moon-bar" style="background:linear-gradient(to right,var(--purple),#a78bfa);"></div></div>
                    <p class="text-[12px] mt-1" style="color:var(--text-secondary);" id="moon-desc">--</p>
                </div>
                <!-- 气压趋势 -->
                <div class="card p-4 sm:col-span-1">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:var(--cyan-dim);border:1px solid var(--cyan-border);">
                            <i class="fa-solid fa-arrow-trend-up" style="color:var(--cyan);font-size:12px;"></i>
                        </div>
                        <span class="text-[11px] tracking-wider" style="color:var(--text-secondary);">气压趋势</span>
                    </div>
                    <div class="flex items-baseline gap-1.5">
                        <span class="text-2xl font-bold" style="color:var(--cyan);" id="pressure-trend-arrow">--</span>
                        <span class="text-sm font-medium" style="color:var(--cyan);" id="pressure-trend-label">--</span>
                    </div>
                    <div class="accent-line mt-2"></div>
                    <p class="text-[12px] mt-2 leading-relaxed" style="color:var(--text-secondary);" id="pressure-trend-desc">--</p>
                </div>
            </div>

            <!-- 温差分析隐藏内容（用于JS动态填充） -->
            <div id="temp-diff-content-hidden" class="hidden"></div>
        </div>

        <!-- ====== 右列 ====== -->
        <div class="lg:col-span-5 space-y-5 sm:space-y-6">

            <!-- 渔情指数 -->
            <div class="card-solid p-5 sm:p-6 anim-rise" style="animation-delay:0.14s">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2.5">

const AMAP_KEY = '4156f446d0e20e7e20b4c686a45ffa14';
const AMAP_GEOCODE_BASE = 'https://restapi.amap.com/v3/geocode/geo';
const AMAP_REVERSE_GEOCODE_BASE = 'https://restapi.amap.com/v3/geocode/regeo';
const OPENMETEO_BASE = 'https://api.open-meteo.com/v1/forecast';
const MARINE_BASE = 'https://marine-api.open-meteo.com/v1/marine';

async function getCoords(name) {
    try {
        const url = `${AMAP_GEOCODE_BASE}?key=${AMAP_KEY}&address=${encodeURIComponent(name)}&city=&output=json`;
        const res = await fetch(url); const data = await res.json();
        if(data.status==='1'&&data.geocodes&&data.geocodes.length>0) {
            const loc = data.geocodes[0].location.split(','); return {lat:parseFloat(loc[1]), lon:parseFloat(loc[0])};
        } return null;
    } catch { return null; }
}
async function reverseGeocode(lat, lon) {
    try {
        const url = `${AMAP_REVERSE_GEOCODE_BASE}?key=${AMAP_KEY}&location=${lon},${lat}`;
        const res = await fetch(url); const data = await res.json();
        if(data.status==='1'&&data.regeocode) return data.regeocode.formatted_address;
        return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
    } catch { return `${lat.toFixed(2)}, ${lon.toFixed(2)}`; }
}
async function fetchWeather(lat, lon) {
    try {
        const url = `${OPENMETEO_BASE}?latitude=${lat}&longitude=${lon}&current=pressure_msl,weather_code,temperature_2m,wind_speed_10m,wind_direction_10m&hourly=pressure_msl&past_hours=12&forecast_hours=1&timezone=auto`;
        const res = await fetch(url); if(!res.ok) throw new Error('天气API失败');
        const data = await res.json(); const {current, hourly} = data;
        const hourlyP = hourly?.pressure_msl?.filter(v=>v!==null) || [];
        return {
            pressure: Math.round(current.pressure_msl),
            weatherCode: current.weather_code,
            waterTemp: Math.max(5, Math.min(35, Math.round(current.temperature_2m + 2))),
            windSpeed: current.wind_speed_10m, windDir: current.wind_direction_10m,
            hourlyPressure: hourlyP
        };
    } catch(e) { handleApiError(e,'天气'); return {pressure:1013, weatherCode:3, waterTemp:20, windSpeed:3, windDir:0, hourlyPressure:[]}; }
}
async function fetchWeeklyTempDiff(lat, lon) {
    try {
        const url = `${OPENMETEO_BASE}?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
        const res = await fetch(url); if(!res.ok) throw new Error('一周数据API失败');
        const {daily} = await res.json();
        let maxSingleDayDiff = 0; let totalWeeklyDiff = 0;
        if(daily && daily.temperature_2m_max && daily.temperature_2m_min) {
            const maxTemps = daily.temperature_2m_max, minTemps = daily.temperature_2m_min;
            const days = maxTemps.length;
            for(let i=0;i<days;i++) { const diff = maxTemps[i]-minTemps[i]; if(diff>maxSingleDayDiff) maxSingleDayDiff=diff; totalWeeklyDiff+=diff; }
            return { singleDayMax: Math.round(maxSingleDayDiff), weeklyAvgDiff: Math.round(totalWeeklyDiff/days), raw:{maxTemps,minTemps} };
        } return { singleDayMax:0, weeklyAvgDiff:0 };
    } catch(e) { console.warn("Weekly temp data failed:", e); return { singleDayMax:0, weeklyAvgDiff:0 }; }
}
async function fetchWaterTemp(lat, lon) {
    try {
        const url = `${MARINE_BASE}?latitude=${lat}&longitude=${lon}&current=sea_surface_temperature&timezone=auto&forecast_days=1`;
        const res = await fetch(url); const data = await res.json();
        if(data.current?.sea_surface_temperature!==null && data.current?.sea_surface_temperature!==undefined)
            return Math.round(data.current.sea_surface_temperature);

    } catch {

        catch { return 20; }
    }
}
async function fetchWeeklyWaterTempDiff(lat, lon) {
    try {
        const url = `${MARINE_BASE}?latitude=${lat}&longitude=${lon}&daily=sea_surface_temperature_max,sea_surface_temperature_min,sea_surface_temperature_mean&timezone=auto&forecast_days=7`;
        const res = await fetch(url); const {daily} = await res.json();
        if(daily && daily.sea_surface_temperature_max && daily.sea_surface_temperature_max[0]!==null) {
            const maxSST = daily.sea_surface_temperature_max, minSST = daily.sea_surface_temperature_min;
            let maxSingleDayDiff=0, totalWeeklyDiff=0; const days=maxSST.length;
            for(let i=0;i<days;i++) { const diff=maxSST[i]-minSST[i]; if(diff>maxSingleDayDiff) maxSingleDayDiff=diff; totalWeeklyDiff+=diff; }
            return { singleDayMax:Math.round(maxSingleDayDiff), weeklyAvgDiff:Math.round(totalWeeklyDiff/days), source:'sst', raw:{maxTemps:maxSST,minTemps:minSST} };
        } throw new Error('no sst daily');

async function calculatePrediction() {
    const loading = $('loading'), btn = $('calculate-btn'), msgEl = $('result-message');
    loading.classList.remove('hidden'); btn.disabled = true;
    try {
        let lat, lon;
        const loc = $('location').value.trim();
        if(loc) {
            const coords = await getCoords(loc);
            if(!coords) throw new Error(t('err_location_not_found'));
            currentCoords = coords; lat = coords.lat; lon = coords.lon;
            $('location-display').textContent = loc;
            if($('location-display-pill')) $('location-display-pill').textContent = loc;
            updateMapMarker(lat, lon);
            localStorage.setItem('lastLat', lat); localStorage.setItem('lastLon', lon);
        } else if(currentCoords) {
            ({lat, lon} = currentCoords);
            $('location-display').textContent = t('label_custom');
            if($('location-display-pill')) $('location-display-pill').textContent = t('label_custom');
        } else { throw new Error(t('err_no_location')); }
        const [weatherData, waterTemp, tempDiffData] = await Promise.all([
            fetchWeather(lat, lon).catch(()=>({pressure:1013,weatherCode:3,waterTemp:20,windSpeed:3,windDir:0, hourlyPressure:[]})),
            fetchWaterTemp(lat, lon),
            fetchWeeklyWaterTempDiff(lat, lon)
        ]);
        $('pressure-value').textContent = weatherData.pressure;
        updateWeatherText(weatherData.weatherCode);
        $('water-temp-value').textContent = waterTemp + '°C';
        const windInfo = windSpeedToLevel(weatherData.windSpeed);
        $('wind-level').textContent = t('wind_level', {level:windInfo.level, text:windInfo.text});
        $('wind-direction').textContent = windDirectionToText(weatherData.windDir);
        updateTempDiffUI(tempDiffData);
        const dt = new Date($('time').value);
        if(isNaN(dt.getTime())) throw new Error(t('err_select_time'));
        const hour = dt.getHours(); const p = weatherData.pressure; const wt = waterTemp; const wind = windInfo.level;
        const baseScores = { time: calculateTimeScore(hour), weather: mapWeatherCodeToScore(weatherData.weatherCode), wind: calculateWindScore(wind), pressure: calculatePressureScore(p), waterTemp: calculateWaterTempScore(wt) };
        let tempDiffPenalty = 0;
        if(tempDiffData.singleDayMax>=15) tempDiffPenalty=40;
        else if(tempDiffData.singleDayMax>=12) tempDiffPenalty=25;
        else if(tempDiffData.singleDayMax>=10) tempDiffPenalty=15;
        else if(tempDiffData.singleDayMax>=8) tempDiffPenalty=8;
        let total = Math.round(baseScores.time*0.3 + baseScores.weather*0.2 + baseScores.wind*0.15 + baseScores.pressure*0.2 + baseScores.waterTemp*0.15);
        total = Math.max(0, total - tempDiffPenalty);
        const msg = getMessage(total);
        const scoreEl = $('score');
        scoreEl.textContent = total;
        msgEl.innerHTML = `<div class="flex items-center gap-2"><span class="text-lg">${msg.t}</span></div>`;
        updateProgress('time', baseScores.time);
        updateProgress('weather', baseScores.weather);
        updateProgress('wind', baseScores.wind);
        updateProgress('pressure', baseScores.pressure);
        updateProgress('water-temp', baseScores.waterTemp);
        const season = getSeason(dt.getMonth()+1, lat);
        const moonPhase = calculateMoonPhase(dt);
        const pressureTrend = getPressureTrend(weatherData.hourlyPressure);
        const fishSpeciesId = ($('fish-species')?$('fish-species').value:'auto');
        const fishSpecies = getSpecies(fishSpeciesId);
        const speciesScore = calcSpeciesScore(fishSpecies, wt, dt.getMonth()+1, lat);
        if(fishSpeciesId!=='auto'&&!isNaN(speciesScore)&&speciesScore>0) total = Math.round(total*0.7 + speciesScore*0.3);
        const tips = generateExpertTips(weatherData.weatherCode, wind, wt, $('fishing-type').value==='saltwater', tempDiffData, pressureTrend, moonPhase, season, fishSpecies);
        $('expert-tips').innerHTML = tips.map(t=>`<div class="tip-card" style="border-left-color:var(--cyan);"><div class="flex gap-3"><div class="flex-1"><p class="text-[12px] leading-relaxed" style="color:var(--text-secondary);">${t}</p></div></div></div>`).join('');
    } catch(e) { handleApiError(e, '预测'); }
    finally { loading.classList.add('hidden'); btn.disabled = false; }
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
    const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
    $('time').value = now.toISOString().slice(0,16);
    initMap();
    const savedLat = localStorage.getItem('lastLat'), savedLon = localStorage.getItem('lastLon');
    if(savedLat&&savedLon) {
        currentCoords = {lat:parseFloat(savedLat), lon:parseFloat(savedLon)};
        updateMapMarker(currentCoords.lat, currentCoords.lon);
        $('location-display').textContent = localStorage.getItem('lastLocationName') || t('label_history');
        if($('location-display-pill')) $('location-display-pill').textContent = localStorage.getItem('lastLocationName') || t('label_history');
        syncEnvData();
        $('expert-tips').innerHTML = '<p class="text-[12px]" style="color:var(--text-secondary);">' + t('restored_data') + '</p>';
    }
    const executeLocationSearch = async () => {
        const v = $('location').value.trim();
        if(v.length<2) return;
        const btn = $('search-location-btn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        const coords = await getCoords(v);
        if(coords) {
            currentCoords = coords;
            localStorage.setItem('lastLat', coords.lat); localStorage.setItem('lastLon', coords.lon);
            localStorage.setItem('lastLocationName', v);
            $('location-display').textContent = v;
            if($('location-display-pill')) $('location-display-pill').textContent = v;
            updateMapMarker(coords.lat, coords.lon);
            await syncEnvData();
        }
        btn.innerHTML = '<i class="fa-solid fa-search text-sm"></i>';
    };
    const handleLocChange = debounce(executeLocationSearch, 900);
    $('location').addEventListener('blur', handleLocChange);
    $('location').addEventListener('change', handleLocChange);
    $('location').addEventListener('keypress', (e) => { if(e.key==='Enter') { e.preventDefault(); executeLocationSearch(); } });
    $('search-location-btn').addEventListener('click', executeLocationSearch);
    $('get-location').addEventListener('click', async() => {
        const btn = $('get-location');
        btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
        try {
            const pos = await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:8000}));
            currentCoords = {lat:pos.coords.latitude, lon:pos.coords.longitude};
            $('location').value = await reverseGeocode(currentCoords.lat, currentCoords.lon);
            $('location-display').textContent = t('label_gps');
            if($('location-display-pill')) $('location-display-pill').textContent = t('label_gps');
            localStorage.setItem('lastLocationName', $('location').value);
            updateMapMarker(currentCoords.lat, currentCoords.lon);
            localStorage.setItem('lastLat', currentCoords.lat); localStorage.setItem('lastLon', currentCoords.lon);
            await syncEnvData();
        } catch(e) { handleApiError(e,'定位'); }
        finally { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-crosshairs text-sm"></i>'; }
    });
    $('calculate-btn').addEventListener('click', calculatePrediction);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });
    setLanguage(currentLang);
});
</script>
